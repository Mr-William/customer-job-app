# Fail2ban filter: failed logins against the job tracker API.
# Nginx combined log, e.g.:
#   1.2.3.4 - - [05/Sep/2026:10:25:31 +0000] "POST /api/auth/login HTTP/1.1" 401 123
#
# Test:
#   sudo fail2ban-regex /var/log/nginx/access.log /etc/fail2ban/filter.d/nginx-login.conf

[Definition]
# First line: fail2ban stripped the timestamp, leaving empty []
# Second line: full log line if the date was not stripped
failregex = ^<HOST> - \S+ \[\] "POST /api/auth/login(?:\?[^\s]*)? HTTP/[^"]*" (401|403)
            ^<HOST> - \S+ \[[^\]]*\] "POST /api/auth/login(?:\?[^\s]*)? HTTP/[^"]*" (401|403)
ignoreregex =

datepattern = {^\[}?%%d/%%b/%%Y:%%H:%%M:%%S
