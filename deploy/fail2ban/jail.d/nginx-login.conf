# Ban IPs that fail POST /api/auth/login (401 invalid creds, 403 unapproved).
# Install:
#   sudo cp deploy/fail2ban/filter.d/nginx-login.conf /etc/fail2ban/filter.d/
#   sudo cp deploy/fail2ban/jail.d/nginx-login.conf /etc/fail2ban/jail.d/
#   sudo fail2ban-client reload
#   sudo fail2ban-client status nginx-login

[nginx-login]
enabled  = true
port     = http,https
filter   = nginx-login
logpath  = /var/log/nginx/access.log
backend  = auto
maxretry = 5
findtime = 10m
bantime  = 1h
ignoreip = 127.0.0.1 ::1
