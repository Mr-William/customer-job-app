# Catch-all: do not serve the app on the raw public IP.
# Install:
#   sudo cp deploy/nginx/drop-unknown.conf /etc/nginx/sites-available/drop-unknown
#   sudo ln -sf /etc/nginx/sites-available/drop-unknown /etc/nginx/sites-enabled/drop-unknown
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Real hostname traffic still goes to sites-enabled/jobtracker (Let's Encrypt).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# Nginx 1.19.4+: reject TLS on unknown SNI / IP-literal hosts with no cert.
# If nginx -t fails here, comment this block and use the snakeoil fallback below.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

# Fallback if ssl_reject_handshake is unsupported:
# sudo apt install -y ssl-cert
# server {
#     listen 443 ssl default_server;
#     listen [::]:443 ssl default_server;
#     server_name _;
#     ssl_certificate     /etc/ssl/certs/ssl-cert-snakeoil.pem;
#     ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;
#     return 444;
# }
